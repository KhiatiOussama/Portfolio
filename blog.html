<!DOCTYPE html>
<html lang="fr" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Oussama Khiati</title>
  <meta name="description" content="Articles techniques sur le développement web par Oussama Khiati.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] },
          colors: {
            accent: { DEFAULT: '#8b5cf6', light: '#a78bfa', dark: '#7c3aed' },
            cyan: '#06b6d4',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon-32x32.png" type="image/x-icon">

<body class="bg-white dark:bg-[#0a0a0f] text-slate-900 dark:text-slate-200 font-sans antialiased transition-colors duration-300">

  <header class="fixed top-0 inset-x-0 z-50 bg-white/80 dark:bg-[#0a0a0f]/80 backdrop-blur-xl border-b border-slate-200 dark:border-white/10">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-display font-bold text-xl">
        <span class="text-accent" aria-hidden="true">&lt;/&gt;</span>
        <span>OK<span class="text-accent">.</span></span>
      </a>
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-sm font-medium hover:text-accent transition" data-i18n="blog_back">← Portfolio</a>
        <button id="theme-toggle" class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-white/10 flex items-center justify-center" aria-label="Changer de thème">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </nav>

  <main class="pt-32 pb-24 px-6">
    <div class="max-w-4xl mx-auto">
      <div class="text-center mb-16">
        <span class="inline-block px-4 py-1.5 rounded-full bg-accent/10 text-accent text-sm font-semibold mb-6">📝 Blog</span>
        <h1 class="font-display font-bold text-4xl md:text-6xl mb-4" data-i18n="blog_title">
          Articles <span class="gradient-text">techniques</span>
        </h1>
        <p class="text-slate-600 dark:text-slate-400 max-w-2xl mx-auto" data-i18n="blog_subtitle">

      <div id="articles-container" class="space-y-6"></div>
    </div>

  <footer class="py-8 px-6 text-center text-slate-500 text-sm border-t border-slate-200 dark:border-white/5">
    <p>© <span id="year"></span> Oussama Khiati — <a href="index.html" class="text-accent hover:underline" data-i18n="blog_back">Retour au portfolio</a></p>
  </footer>

  <script src="config.js"></script>
  <script src="translations.js"></script>
  <script src="blog.js"></script>
